name: Production

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false # a cancelled tofu apply leaves a half-applied state and a held lock

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Run lint
        run: |
          npm ci
          npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Run test
        run: |
          npm ci
          npm run test

  e2e:
    # Disable e2e tests for now, they are flaky
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Build application
        run: |
          bash ./scripts/get-openscad.sh
          npm ci
          npm run build

      - name: Run e2e tests
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          start: npm run serve
          wait-on: 'http://localhost:8000'
          wait-on-timeout: 30

      - name: Upload screenshots
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: cypress-screenshots
          path: |
            cypress/screenshots
            cypress/snapshots/diff

  tofu-apply:
    needs: [lint, test] # TODO Add e2e again once the flaking and strange behaviour is fixed
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PRODUCTION }}
          role-session-name: openscad-tofu-apply
          aws-region: us-east-1

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: '1.9.0'
          tofu_wrapper: false

      - name: tofu apply
        working-directory: terraform/environments/production
        run: |
          tofu init -input=false -lockfile=readonly
          tofu apply -input=false -auto-approve

  deploy:
    needs: tofu-apply
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Build
        run: |
          bash ./scripts/get-openscad.sh
          npm ci
          NODE_ENV=production npm run build

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PRODUCTION }}
          role-session-name: openscad-deploy
          aws-region: us-east-1

      # No CloudFront invalidation: the distribution uses CachingDisabled. If it
      # ever moves to a caching policy, this job must invalidate after promoting,
      # or a promotion will not be visible.
      - name: Upload and promote
        env:
          BUCKET: openforge-openscad-website
          SHA: ${{ github.sha }}
        run: |
          # An immutable copy of this build, so any past build can be put back.
          aws s3 sync dist "s3://$BUCKET/$SHA"
          # Promote to current/. Assets first and HTML second, so a visitor
          # mid-promotion never gets a page whose assets have not arrived.
          # cp, not sync: sync skips keys of equal size that are not older,
          # which makes putting an older build back a silent no-op.
          aws s3 cp --recursive --only-show-errors "s3://$BUCKET/$SHA" "s3://$BUCKET/current" --exclude "*.html"
          aws s3 cp --recursive --only-show-errors "s3://$BUCKET/$SHA" "s3://$BUCKET/current" --exclude "*" --include "*.html"
          echo "current/ now holds $SHA"
